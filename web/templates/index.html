<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hunter-Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="upload">
  <main class="shell narrow">
    <header class="hero">
      <p class="eyebrow">SECURITY ANALYSIS</p>
      <h1>Hunter-Agent</h1>
      <p class="lede">上传证据并选择自主总脑或专业后端调试入口。</p>
    </header>
    <section class="panel upload-panel">
      <form id="upload-form">
        <label class="file-picker" for="file-input">
          <span class="file-icon">＋</span>
          <strong id="file-label">选择一个文件</strong>
          <small>当前支持 Reverse（Kong）与轻量 DFIR（TRUDI）</small>
        </label>
        <input id="file-input" name="file" type="file" required>
        <label for="goal-input">任务目标</label>
        <textarea id="goal-input" name="goal" rows="3" placeholder="说明希望 Hunter 最终回答什么"></textarea>
        <label for="mode-input">执行模式</label>
        <select id="mode-input" name="mode">
          <option value="autonomous">自主模式（Hunter 总脑）</option>
          <option value="automatic">自动分类（兼容入口）</option>
          <option value="force_dfir">强制取证</option>
          <option value="force_reverse">强制逆向</option>
          <option value="force_pentest">强制渗透</option>
          <option value="force_vulnerability_research">强制漏洞挖掘</option>
        </select>
        <button id="submit-button" type="submit">开始分析</button>
      </form>
      <div id="upload-error" class="error-box hidden" role="alert"></div>
    </section>
    <p class="footnote">真实文件类型由 Layer 1 / libmagic 识别，不使用浏览器 MIME 作为判断依据。</p>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
